name: P0 isolated real-generator integration
on:
  push:
    branches:
      - review/plain-language-safety-cz-sk-en-hu-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm fixtures match untouched source
        run: python3 tests/scripts/check_p0_root_source.py
      - name: Patch disposable checkout only
        run: python3 tests/scripts/patch_p0_index_isolated.py --isolated-ci
      - name: Install generator dependencies
        run: npm install --prefix tools/seo --no-audit --no-fund
      - name: Regenerate with actual project generator
        run: node tools/seo/regenerate.cjs
      - name: Assert all 16 revised articles rendered by production generator
        run: |
          python3 - <<'PY'
          import pathlib,json,html
          root=pathlib.Path('.')
          data=json.loads((root/'tests/fixtures/plain-language-safety-20261123.json').read_text())
          for a in data:
              for lang in ('cs','sk','en','hu'):
                  page=(root/lang/'clanky'/a['id']/'index.html').read_text()
                  assert '<html lang="'+lang+'">' in page
                  assert '<link rel="canonical"' in page
                  for heading,body in a['locales'][lang]['sections']:
                      # HTML rendering can add markup; verify the exact distinctive appended text.
                      old=next(x for x in (json.loads((root/'content/articles-foot-care-20261113.json').read_text())+json.loads((root/'content/articles-20261113.json').read_text())) if x['id']==a['id'])
                      before=old['locales'][lang]['sections']
                      index=[x[0] for x in before].index(heading)
                      supplement=body[len(before[index][1]):].strip()
                      if supplement:
                          assert html.escape(supplement,quote=False) in page or supplement in html.unescape(page), (a['id'],lang,heading)
                  for name,url in a['sources']:
                      assert url.replace('&','&amp;') in page or url in page
          print('PASS: all 16 revised localized articles generated by the actual SEO pipeline')
          PY
      - name: Assert no unexpected changed tracked paths
        run: |
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          allowed_prefixes=('cs/clanky/','sk/clanky/','en/clanky/','hu/clanky/','seo/')
          allowed_exact={'index.html','sitemap.xml'}
          unexpected=[x for x in changed if x not in allowed_exact and not x.startswith(allowed_prefixes)]
          assert not unexpected, unexpected
          print('PASS: diff paths constrained to root and generated SEO output; files changed:',len(changed))
          PY
      - name: Save review-only changed-file inventory
        run: git diff --stat > p0-generated-diff-stat.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p0-real-generator-diff-review
          path: p0-generated-diff-stat.txt
          retention-days: 14
