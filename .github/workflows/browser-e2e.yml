name: DIA Kompas 3.0 real-browser audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'nl-intents.js'
      - 'audit/browser-e2e-ci.cjs'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:
jobs:
  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real Chromium at required viewports
        env:
          E2E_SCOPE: all
        run: node audit/browser-e2e-ci.cjs
      - name: Save screenshots and results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dia-kompas-browser-e2e
          path: audit-output/
          if-no-files-found: warn
