name: Public DIA Kompas E2E audit
on:
  push:
    branches: [feature/production-e2e-20261108]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Retest affected scenarios against isolated test branch
        env:
          AUDIT_URL: http://127.0.0.1:8765/index.html
          AUDIT_EXPECTED_SHA256: 82fad326679fca98493ad4034ec93c5e6d431b367a6665486566d5c89d1aa5c4
          AUDIT_FILTER: qa/retest-ids.json
          AUDIT_PRODUCTION_SHA: fb3693961bad5256b4a9358dee8488e40306cc8b
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/diakompas-audit-server.log 2>&1 &
          node qa/audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-retest-evidence
          path: test-results
          retention-days: 1
