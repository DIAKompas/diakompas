name: Public DIA Kompas E2E audit
on:
  push:
    branches: [feature/production-e2e-20261108]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Retest affected scenarios against isolated test branch
        env:
          AUDIT_URL: http://127.0.0.1:8765/index.html
          AUDIT_EXPECTED_SHA256: 0c83bd5026d110e516ffd49fc0ccf4bee3f9297ef1aa970b571016c9ef97ac28
          AUDIT_FILTER: qa/retest-ids-final.json
          AUDIT_PRODUCTION_SHA: fb3693961bad5256b4a9358dee8488e40306cc8b
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/diakompas-audit-server.log 2>&1 &
          node qa/audit.cjs
      - name: Capture the two known public Hungarian frequency failures
        if: always()
        env:
          AUDIT_URL: https://diakompas.github.io/diakompas/
          AUDIT_EXPECTED_SHA256: 2622957564b018e8c66e2071c239c9a36b12db0e60cfa7615ac5235d2584d78c
          AUDIT_PRODUCTION_SHA: fb3693961bad5256b4a9358dee8488e40306cc8b
          AUDIT_FILTER: qa/baseline-frequency-ids.json
          AUDIT_OUT: test-results/baseline-frequency
        run: node qa/audit.cjs || test -f test-results/baseline-frequency/results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: targeted-retest-evidence
          path: test-results
          retention-days: 1
