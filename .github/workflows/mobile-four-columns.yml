name: Mobile four-column browser verification
on:
  pull_request:
    branches: [main]
    paths: ['index.html', 'audit/mobile-four-columns.cjs', '.github/workflows/mobile-four-columns.yml']
  push:
    branches: [main]
    paths: ['index.html', 'audit/mobile-four-columns.cjs', '.github/workflows/mobile-four-columns.yml']
jobs:
  mobile-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify test branch in real Chromium
        if: github.event_name == 'pull_request'
        run: node audit/mobile-four-columns.cjs
      - name: Verify public GitHub Pages in real Chromium
        if: github.event_name == 'push'
        env:
          MOBILE_TEST_ORIGIN: https://diakompas.github.io/diakompas/
        run: node audit/mobile-four-columns.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-four-columns-${{ github.event_name }}
          path: audit-output/mobile-four-columns/
