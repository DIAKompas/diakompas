name: Photo-card mobile preview artifact (no production deploy)
on:
  push:
    branches:
      - review/plain-language-safety-cz-sk-en-hu-20261123
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated photographic-card prototype
        run: python3 tests/scripts/build_photo_card_preview.py
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Serve prototype locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/dia-photo-preview.log 2>&1 &
          sleep 2
      - name: Verify eight screen widths and keyboard focus
        run: node tests/browser/p3-expanded-accessibility.cjs
      - name: Verify eight photo cards and topic visibility at 393px
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true});
            const p=await b.newPage({viewport:{width:393,height:873}});
            await p.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
            await p.waitForTimeout(1200);
            const v=await p.evaluate(()=>({
              cards:document.querySelectorAll('#zacinam .dk-start-grid > .dk-start-card').length,
              photos:document.querySelectorAll('#zacinam .dk-photo-thumb').length,
              topic:!!document.querySelector('#topics'),
              grid:getComputedStyle(document.querySelector('#zacinam .dk-start-grid')).gridTemplateColumns,
              overflow:document.documentElement.scrollWidth>innerWidth+2
            }));
            console.log(v);
            if(v.cards!==7||v.photos!==8||!v.topic||v.overflow||v.grid.split(' ').length!==4)process.exitCode=1;
            await b.close();
          })().catch(e=>{console.error(e);process.exitCode=2});
          JS
      - name: Package offline mobile preview
        if: always()
        run: |
          mkdir -p photo-preview
          cp index.html photo-preview/index.html
          cat > photo-preview/README.txt <<'EOF'
          DIA Kompas – isolated mobile photo-card preview.
          Open index.html in a browser after extracting the ZIP.
          This is a local prototype, NOT a public deployment.
          Some browser features may require an HTTP server.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dia-kompas-photo-mobile-preview
          path: photo-preview/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dia-kompas-photo-browser-report
          path: test-results/
          if-no-files-found: warn
