name: Modal reader browser E2E
on:
  push:
    branches: [feature/modalni-ctecka-20261117]
    paths: ['index.html','modal-reader.js','modal-reader-adapter.js','audit/modal-reader-ci.cjs','.github/workflows/modal-reader-e2e.yml']
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run actual browser E2E
        run: node audit/modal-reader-ci.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modal-reader-results
          path: audit-output/modal-reader/
