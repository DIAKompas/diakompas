name: DIA Kompas assistant isolated tests
on:
  push:
    branches:
      - feature/interaktivni-pruvodce-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test terminology
        run: node --test experimental/terminology.test.cjs
      - name: Test AI gateway without secrets
        run: node --test tests/ai-gateway.test.mjs
      - name: Install Playwright
        run: npm install --no-save @playwright/test && npx playwright install --with-deps chromium
      - name: Browser smoke tests
        id: smoke
        run: npx playwright test tests/assistant.spec.cjs --browser chromium --reporter=line
      - name: Exact viewport and network audit
        if: ${{ always() && !cancelled() }}
        env:
          DIA_QA_LOCAL: '1'
          DIA_TEST_URL: http://127.0.0.1:8765/preview/index.html
          DIA_QA_OUT: test-results/r14-final-audit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/diakompas-preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node preview/tests/r14-final-audit.cjs
      - name: Verify deployed public production
        env:
          DIA_RELEASE_URL: https://diakompas.github.io/diakompas/
          DIA_RELEASE_HASH: 4eea66301be4e4ecaafb3d5132a4547be05441e9dad2812ff3336e8b621884a8
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/diakompas-release-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node preview/tests/r14-release.cjs
      - name: Verify mood hotfix
        env:
          MOOD_URL: https://diakompas.github.io/diakompas/
          MOOD_HASH: 4eea66301be4e4ecaafb3d5132a4547be05441e9dad2812ff3336e8b621884a8
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mood-hotfix-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          node preview/tests/r14-mood.cjs
      - name: Preserve audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: r14-preproduction-evidence
          path: |
            test-results
            /tmp/diakompas-preview-http.log
          retention-days: 1

