name: Mobile topic card height E2E
on:
  push:
    branches: [fix/mobile-topic-card-height-20261117, fix/mobile-topics-empty-space-20261117, fix/mobile-topic-preview-equal-height-20261117, fix/topic-card-fill-20261117]
    paths: ['index.html','mobile-topic-card-height.js','audit/mobile-topic-height-ci.cjs','.github/workflows/mobile-topic-height-e2e.yml']
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser E2E mobile and desktop CZ SK EN HU
        run: node audit/mobile-topic-height-ci.cjs
