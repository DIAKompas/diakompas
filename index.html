hŕňať životný štýl, lieky a niekedy inzulín.", "Príznakmi môžu byť časté močenie, smäd, únava a nevysvetliteľné chudnutie. Diagnóza sa stanovuje laboratórnymi testami.", "Pri vracaní, bolestiach brucha, hlbokom dýchaní či zmätenosti vyhľadajte urgentnú pomoc."], 0], ["Stravovanie pri diabete bez zbytočných zákazov", "Princípy vyváženého a individuálneho jedálnička.", ["Jeden jedálniček nevyhovuje každému. Zohľadňuje sa typ diabetu, liečba aj osobné preferencie.", "Užitočné je zaradiť zeleninu, vlákninu, bielkoviny a vhodné tuky a sledovať porcie sacharidov.", "Pri inzulínovej liečbe môže byť potrebné počítanie sacharidov podľa odporúčania diabetologického tímu.", "Extrémne diéty ani samostatné zmeny dávok liekov nie sú univerzálnym riešením."], 1], ["Diabetická noha: každodenná kontrola", "Varovné príznaky a bezpečná starostlivosť.", ["Pravidelne kontrolujte chodidlá aj priestory medzi prstami. Pomôcť môže zrkadlo alebo blízka osoba.", "Nohy jemne umývajte, osušte a používajte vhodnú obuv. Rizikoví pacienti by nemali chodiť naboso.", "Nová rana, začervenanie, opuch, teplo alebo zmena farby vyžadujú rýchlu konzultáciu s lekárom.", "Odborné vyšetrenie nôh sa odporúča aspoň raz ročne, pri vyššom riziku častejšie."], 2], ["Meranie glukózy a hypoglykémia", "Glukomer, CGM a individuálny bezpečnostný plán.", ["Glukomer meria glukózu z krvi, CGM sleduje vývoj v medzibunkovej tekutine.", "Hypoglykémia sa zvyčajne definuje ako glukóza pod 3,9 mmol/l; môže spôsobiť tras, potenie alebo zmätenosť.", "Pri nízkej glukóze sa riaďte osobným plánom. Človeku v bezvedomí nepodávajte nič ústami a volajte záchrannú službu.", "Cieľové hodnoty sa určujú individuálne."], 3], ["Pohyb a diabetes", "Ako začať bezpečne a postupne.", ["Pohyb pomáha kondícii, nálade a pri diabete 2. typu môže zlepšiť citlivosť na inzulín.", "Začnite primeranou aktivitou, napríklad chôdzou, a záťaž zvyšujte postupne.", "Pri inzulíne alebo liekoch s rizikom hypoglykémie preberte bezpečný postup s tímom.", "Pri bolesti na hrudi alebo výraznej dýchavičnosti aktivitu ukončite a vyhľadajte pomoc."], 4], ["Glukomery, senzory a inzulínové pumpy", "Prehľad technológií pre každodennú starostlivosť.", ["Glukomer umožňuje jednotlivé merania, CGM ukazuje trendy a podľa zariadenia upozorňuje na zmeny.", "Inzulínové pumpy podávajú inzulín podľa nastavenia; niektoré spolupracujú so senzormi.", "Výber závisí od liečby, dostupnosti a bezpečného používania.", "Nastavenie pumpy a liečby konzultujte s vyškoleným tímom."], 5]]}, "en": {"nav": ["Topics", "Articles", "Sources", "About"], "hero": "A guide to living with diabetes", "sub": "Clear information about type 1 and type 2 diabetes, foot care, nutrition and modern technology.", "explore": "Explore articles", "topics": "Choose a topic", "articles": "First educational articles", "search": "Search articles…", "read": "Read article", "sources": "Clinical sources", "about": "About this project", "abouttext": "DiaKompas is an independent educational project in Czech, Slovak and English. It does not provide diagnoses or personalized treatment plans.", "warning": "Notice: This is educational information, not medical advice. Discuss medicines and dosing with your healthcare team. Call emergency services for unconsciousness or severe acute symptoms.", "review": "Editorial draft • awaiting clinical review before promotion", "all": "All topics", "none": "No matching articles found.", "footer": "Educational content • CZ / SK / EN", "date": "Updated 14 Oct 2026", "labels": ["Diabetes basics", "Nutrition", "Foot care", "Glucose monitoring", "Movement", "Technology"], "cards": [["Type 1 vs type 2 diabetes: what differs?", "Key differences, symptoms and diagnosis.", ["Type 1 diabetes is caused by immune destruction of insulin-producing cells. People with type 1 diabetes need insulin.", "Type 2 diabetes involves insulin resistance and a progressive inability to produce enough insulin. Care may include lifestyle changes, medicines and sometimes insulin.", "Possible symptoms include frequent urination, thirst, fatigue and unexplained weight loss. Diagnosis requires clinical laboratory testing.", "Vomiting, abdominal pain, deep breathing or confusion may signal an emergency: seek urgent care."], 0], ["Eating well with diabetes", "Practical principles without unnecessary restrictions.", ["There is no single diet for everyone. Plans depend on diabetes type, treatment, preferences and other health factors.", "Vegetables, fiber-rich foods, protein and unsaturated fats can be useful components; consider portions of carbohydrate-rich foods.", "Carbohydrate counting may be important for some people using insulin, based on their care team’s advice.", "Avoid extreme diets or changing medicine doses without clinical advice."], 1], ["Diabetic foot: daily checks", "How to recognize warning signs and seek help.", ["Check feet regularly, including between the toes. Use a mirror or ask for help if needed.", "Wash gently, dry thoroughly and wear suitable shoes. People at risk of ulcers should avoid walking barefoot.", "A new wound, redness, swelling, warmth or change in color needs prompt clinical assessment.", "A professional foot examination is advised at least annually, more often for higher-risk people."], 2], ["Glucose monitoring and hypoglycemia", "Understanding meters, CGM and safety plans.", ["A blood glucose meter uses a blood sample; continuous glucose monitoring (CGM) tracks trends in interstitial fluid.", "Hypoglycemia is generally defined as glucose below 70 mg/dL (3.9 mmol/L). It may cause shaking, sweating or confusion.", "Follow your individualized low-glucose action plan. Never give food or drink by mouth to someone unconscious; call emergency services.", "Targets and device choices should be individualized."], 3], ["Movement and diabetes", "Starting safely and building a routine.", ["Regular activity supports fitness and mood and may improve insulin sensitivity in type 2 diabetes.", "Start with activity appropriate to your health, such as walking, and increase gradually.", "If you use insulin or medications associated with hypoglycemia, discuss exercise safety with your team.", "Stop activity and seek help for chest pain, severe breathlessness or unusual symptoms."], 4], ["Meters, sensors and insulin pumps", "An overview of everyday diabetes technology.", ["Meters provide individual glucose readings; CGM provides trends and device-dependent alerts.", "Insulin pumps deliver insulin according to programmed settings; some connect to glucose sensors.", "Choice depends on treatment, access and safe use.", "Pump settings and treatment changes require guidance from a trained clinical team."], 5]]}};const SOURCES=[["ADA Standards of Care 2026", "https://professional.diabetes.org/standards-of-care"], ["ADA – Diagnosis and classification", "https://doi.org/10.2337/dc26-s002"], ["ADA – Hypoglycemia and glycemic goals", "https://doi.org/10.2337/dc26-s006"], ["ADA – Foot care", "https://doi.org/10.2337/dc26-s012"], ["IWGDF – Prevention of diabetic foot ulcers", "https://iwgdfguidelines.org/prevention-guideline-2023/"]];const icons=['🩺','🥗','🦶','📈','🚶','📱'];let lang='cs',filter=-1;const $=id=>document.getElementById(id);function node(tag,cls,txt){const el=document.createElement(tag);if(cls)el.className=cls;if(txt!==undefined)el.textContent=txt;return el}function render(){const d=DATA[lang];document.documentElement.lang=lang;d.nav.forEach((v,i)=>$('nav'+i).textContent=v);for(const [id,key] of Object.entries({hero:'hero',sub:'sub',explore:'explore',topicTitle:'topics',articlesTitle:'articles',sourcesTitle:'sources',aboutTitle:'about',aboutText:'abouttext',warning:'warning',review:'review',footer:'footer',date:'date',empty:'none'}))$(id).textContent=d[key];$('search').placeholder=d.search;document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',String(b.dataset.lang===lang))});const filters=$('filters');filters.replaceChil
